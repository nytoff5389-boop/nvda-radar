<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เหมียวส่องหุ้น</title>
<meta name="theme-color" content="#f1faf4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1faf4;--surface:#fff;--raise:#eaf7ef;--ink:#2c4639;--ink2:#4a6858;--muted:#86a294;--line:#d5ecdf;
  --accent:#6cc79a;--accent-ink:#2a8a5b;--up:#36ad78;--down:#ff6f80;
  --shadow:0 3px 0 #d5ecdf,0 22px 40px -20px rgba(42,138,91,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14211b;--surface:#1c2c24;--raise:#25392f;--ink:#e9f7ef;--ink2:#cbe3d6;--muted:#93b1a2;--line:#2f463a;--accent:#86dcb0;--accent-ink:#9be8bf;--up:#4fcf94;--down:#ff8796;--shadow:0 3px 0 #2f463a}}
:root[data-theme="dark"]{--bg:#14211b;--surface:#1c2c24;--raise:#25392f;--ink:#e9f7ef;--ink2:#cbe3d6;--muted:#93b1a2;--line:#2f463a;--accent:#86dcb0;--accent-ink:#9be8bf;--up:#4fcf94;--down:#ff8796;--shadow:0 3px 0 #2f463a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.55 Mali,system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(circle at 12% 8%,rgba(108,199,154,.18),transparent 40%),radial-gradient(circle at 90% 90%,rgba(185,228,242,.25),transparent 45%)}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
header{text-align:center;margin:8px 0 24px}
.cat{width:92px;height:92px;margin:0 auto;display:block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font-size:clamp(26px,6vw,36px);margin:6px 0 2px;line-height:1.45}
.sub{color:var(--ink2);margin:0}
.speak{margin-top:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:8px 16px;font:600 14px Mali;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}

.tile{aspect-ratio:1/1;border:2px solid var(--line);border-radius:32px;background:var(--surface);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px;cursor:pointer;
  text-decoration:none;color:inherit;font-family:inherit;transition:transform .15s ease,border-color .15s ease;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-4px);border-color:var(--accent)}
.tile:active{transform:scale(.96)}
.tile .badge{width:clamp(64px,18vw,96px);height:clamp(64px,18vw,96px);border-radius:28px;display:grid;place-items:center;
  font:800 clamp(18px,5vw,26px) Nunito;color:#fff;margin-bottom:6px}
.tile.nvda .badge{background:linear-gradient(135deg,#7bd389,#36ad78)}
.tile.googl .badge{background:linear-gradient(135deg,#8fc8f5,#5b9be6)}
.tile .tk{font:800 clamp(20px,5.5vw,28px) Nunito;letter-spacing:.5px}
.tile .nm{color:var(--muted);font-size:clamp(13px,3.4vw,15px)}
.tile .px{font:800 clamp(17px,4.6vw,22px) Nunito;margin-top:4px}
.tile .ch{font:700 14px Nunito}
.tile .ch.up{color:var(--up)}.tile .ch.down{color:var(--down)}
.tile .lv{font-size:clamp(12px,3.2vw,14px);background:var(--raise);border-radius:999px;padding:2px 10px;margin-top:4px;color:var(--ink2)}
.paw{position:absolute;right:12px;top:10px;opacity:.35;font-size:20px}
@media (max-width:520px){.grid{gap:12px}.tile{padding:8px;gap:0;line-height:1.15;border-radius:26px}.tile .badge{width:44px;height:44px;border-radius:16px;font-size:17px;margin-bottom:4px}
  .tile .tk{font-size:21px}.tile .nm{font-size:12.5px}.tile .px{font-size:17px;margin-top:2px}.tile .lv{font-size:12px;margin-top:4px}.paw{display:none}}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
.theme{position:fixed;top:12px;right:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="สลับธีม">🌙</button>
<main class="wrap">
  <header>
    <svg class="cat" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M18 40 L24 12 L42 30 Z M82 40 L76 12 L58 30 Z" fill="#9fdcbc"/>
      <ellipse cx="50" cy="55" rx="36" ry="32" fill="#c9f0da" stroke="#6cc79a" stroke-width="3"/>
      <circle cx="37" cy="52" r="5" fill="#2c4639"/><circle cx="63" cy="52" r="5" fill="#2c4639"/>
      <circle cx="39" cy="50" r="1.6" fill="#fff"/><circle cx="65" cy="50" r="1.6" fill="#fff"/>
      <path d="M46 62 Q50 66 54 62" stroke="#2c4639" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="28" cy="63" r="5" fill="#ffc6d0" opacity=".8"/><circle cx="72" cy="63" r="5" fill="#ffc6d0" opacity=".8"/>
      <path d="M14 58 H30 M14 66 H30 M70 58 H86 M70 66 H86" stroke="#6cc79a" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>วันนี้จะส่องหุ้นตัวไหนดีเหมียว?</h1>
    <p class="sub">แตะการ์ดเพื่อเข้าไปดูข่าว ความเสี่ยง และกลยุทธ์ 🐾</p>
    <button class="speak" id="speak">🔊 ฟังเหมียวพูด</button>
  </header>
  <section class="grid">
    <a class="tile nvda" href="stock.html?s=NVDA" data-s="NVDA">
      <span class="paw">🐾</span><div class="badge">NV</div>
      <div class="tk">NVDA</div><div class="nm">Nvidia</div>
      <div class="px" id="px-NVDA">…</div><div class="ch" id="ch-NVDA"></div><div class="lv" id="lv-NVDA">กำลังโหลด</div>
    </a>
    <a class="tile googl" href="stock.html?s=GOOGL" data-s="GOOGL">
      <span class="paw">🐾</span><div class="badge">G</div>
      <div class="tk">GOOGL</div><div class="nm">Google (Alphabet)</div>
      <div class="px" id="px-GOOGL">…</div><div class="ch" id="ch-GOOGL"></div><div class="lv" id="lv-GOOGL">กำลังโหลด</div>
    </a>
  </section>
  <p class="sub" id="liveNote" style="text-align:center;margin-top:16px;font-size:13px"></p>
  <footer>ข้อมูลอัปเดตอัตโนมัติ · ไม่ใช่คำแนะนำการลงทุนนะ 💚</footer>
</main>
<script src="live.js"></script>
<script>
const LV={vbad:"🙀 เสี่ยงมาก",bad:"😿 เสี่ยง",neutral:"😺 ปกติ",good:"😸 ดี",vgood:"😻 ดีมาก"};
const NAMES={NVDA:"เอ็นวิเดีย",GOOGL:"กูเกิล"};
// ---- sound: soft "meow" chirp with WebAudio + Thai voice (browsers need a tap first) ----
let ac=null;
function chirp(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="triangle";
    o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(980,t+.12);o.frequency.exponentialRampToValueAtTime(520,t+.32);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.36);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.38)}catch(e){}
}
function say(text){
  try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="th-TH";u.rate=1;u.pitch=1.35;
    const v=speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}
const ASK="สวัสดีเหมียว วันนี้จะเลือกดูหุ้นตัวไหนดีคะ";
let greeted=false;
function greet(){if(greeted)return;greeted=true;chirp();setTimeout(()=>say(ASK),250)}
document.getElementById("speak").onclick=()=>{greeted=true;chirp();setTimeout(()=>say(ASK),250)};
// first touch anywhere (except a tile) plays the greeting; iOS blocks sound before a tap
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".tile,.speak,.theme"))greet()},{once:true});
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
document.querySelectorAll(".tile").forEach(a=>a.addEventListener("click",e=>{
  e.preventDefault();const s=a.dataset.s;chirp();say(`ไปดู ${NAMES[s]} กันเหมียว`);
  setTimeout(()=>{location.href=a.getAttribute("href")},650);
}));
// ---- tile data: live price from the browser every 15 s, risk level from our data file ----
const gotLive={};
function showPx(s,px,c,ses){
  if(px)document.getElementById("px-"+s).textContent="$"+Number(px).toFixed(2);
  if(c!=null){const el=document.getElementById("ch-"+s);el.textContent=(c>=0?"▲ +":"▼ ")+Number(c).toFixed(2)+"%";el.className="ch "+(c>=0?"up":"down")}
}
LiveQuote.poll(["NVDA","GOOGL"],q=>{for(const s in q){gotLive[s]=1;showPx(s,q[s].price,q[s].chg,q[s].ses)}
  document.getElementById("liveNote").textContent="🔴 ราคาสด อัปเดตล่าสุด "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit",second:"2-digit"})+" น. · "+LiveQuote.SES[LiveQuote.session()]+(LiveQuote.session()==="reg"?"":" (ราคา/เปอร์เซ็นต์เป็นราคานอกเวลา เทียบราคาปิดล่าสุด)")},15000);
for(const s of ["NVDA","GOOGL"]){
  fetch(`data/${s}.json?ts=${Date.now()}`,{cache:"no-store"}).then(r=>r.json()).then(d=>{
    const t=d.tech||{};if(!gotLive[s])showPx(s,t.close,t.chg_pct,null);
    const k=d.verdict&&d.verdict.key;document.getElementById("lv-"+s).textContent=LV[k]||"—";
  }).catch(()=>{document.getElementById("px-"+s).textContent="";document.getElementById("lv-"+s).textContent="แตะเพื่อดู"});
}
// ---- theme ----
const root=document.documentElement,tb=document.getElementById("theme");
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
try{const th=localStorage.getItem("theme");if(th)root.dataset.theme=th}catch(e){}
const paint=()=>{tb.textContent=isDark()?"☀️":"🌙"};paint();
tb.onclick=()=>{const n=isDark()?"light":"dark";root.dataset.theme=n;try{localStorage.setItem("theme",n)}catch(e){};paint()};
</script>
</body>
</html>
