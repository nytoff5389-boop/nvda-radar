name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://nytoff5389-boop.github.io"
          for u in "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=NVDA&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json" "https://api.nasdaq.com/api/quote/NVDA/info?assetclass=stocks" "https://query1.finance.yahoo.com/v8/finance/chart/NVDA?interval=1m&range=1d&includePrePost=true" "https://query2.finance.yahoo.com/v8/finance/chart/NVDA" "https://stooq.com/q/l/?s=nvda.us&f=sd2t2ohlcv&h&e=json" "https://www.cnbc.com/quotes/NVDA" "https://api.stocktwits.com/api/2/streams/symbol/NVDA.json"; do
            echo "=== $u"; curl -s -m 15 -D h.txt -o b.txt -H "$O" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" "$u"; grep -iE "^HTTP|access-control|cache-control" h.txt; head -c 400 b.txt; echo; done
          echo "=== TV scanner POST text/plain"
          curl -s -m 15 -D h.txt -o b.txt -H "$O" -H "Content-Type: text/plain" -X POST "https://scanner.tradingview.com/america/scan" --data '{"symbols":{"tickers":["NASDAQ:NVDA","NASDAQ:GOOGL"]},"columns":["close","change","premarket_close","premarket_change","postmarket_close","postmarket_change"]}'; grep -iE "^HTTP|access-control" h.txt; head -c 600 b.txt; echo
          echo "=== TV scanner OPTIONS"; curl -s -m 15 -D - -o /dev/null -X OPTIONS -H "$O" -H "Access-Control-Request-Method: POST" "https://scanner.tradingview.com/america/scan" | grep -iE "^HTTP|access-control"
